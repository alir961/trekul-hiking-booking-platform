name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  checks: write

jobs:
  # Job de setup initial (Checkout et installation JDK)
  setup:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Upload sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  # Job 2: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download sources
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Run Unit Tests
        run: mvn test --fail-at-end jacoco:prepare-agent verify jacoco:report-aggregate

      - name: Push Unit Test Reports
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ./**/target/surefire-reports/TEST-*.xml
          check_name: Unit Tests Report

      - name: Code Coverage Comment
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: "coverage/target/site/jacoco-aggregate/jacoco.xml"
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          title: "Coverage from added files"
          update-comment: true


  # Job 3: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download sources
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Run Integration Tests
        run: mvn integration-test

      - name: List Unit Test Reports
        run: ls -la target/failsafe-reports

      - name: Publish Integration Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ./**/target/failsafe-reports/TEST-*.xml
          check_name: Integration Tests Report


  # Job 4: Code analysis with Checkstyle
  code-analysis:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download sources
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Run Checkstyle
        run: mvn checkstyle:check -Dcheckstyle.failOnViolation=true

      - name: Push Checkstyle report
        if: always()
        uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
          path: ./**/target/checkstyle-result.xml
